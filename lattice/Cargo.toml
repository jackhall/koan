[package]
name = "lattice"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Symbol identity and type identity are content digests.
blake3 = "1.8.5"
# The bump tier the type registry, its tables and every scratch buffer are laid in.
bumpstorage = { path = "../bumpstorage" }

[features]
# Counters koan's tests read across the crate boundary, where `cfg(test)` does not reach. Off by
# default, so the shipped interpreter carries none; koan's dev-dependency turns it on.
counters = []
# Compiles each generated image's hand-written stub in its place, so its generator runs when the
# generated file does not compile: after a change to the stored layout it spells.
bootstrap-image = []
# The image generator — the emitter, the digest checks and the golden compare — which koan's tests
# call across the crate boundary. Off by default, so the shipped interpreter carries none of it. It
# opens the frozen table's slots in `bumpstorage`, which it writes.
generator = ["bumpstorage/generator"]

[dev-dependencies]
# Generated type trees for the lattice's laws and generated spellings for the symbol classes.
proptest = "1"
# The frozen table's slots, which the image generator's tests read as the generator does.
bumpstorage = { path = "../bumpstorage", features = ["generator"] }

# The node-table benchmark: the digest table a type branch lays against the hashbrown table the
# root keeps, over linked stand-in nodes. `cargo bench -p lattice --bench node_table [section…]`.
[[bench]]
name = "node_table"
harness = false
