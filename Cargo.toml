[workspace]
members = ["cellgraph", "lattice", "sexlex"]
default-members = [".", "cellgraph", "lattice", "sexlex"]
resolver = "2"

[package]
name = "koan"
version = "0.1.0"
edition = "2024"
default-run = "koan"

[lib]
name = "koan"
path = "src/lib.rs"

[[bin]]
name = "koan"
path = "src/main.rs"

[features]
# The dhat attribution profiler: owns the binary's global allocator and writes `dhat-heap.json`
# (`tools/dhat_diff.py`).
dhat = ["dep:dhat"]

[dependencies]
mimalloc = { version = "0.1", default-features = false }
# The cell tier's substrate: cells, their regions, the carrier states and the liveness matrix.
cellgraph = { path = "cellgraph" }
# The layout half of the parser: whitespace-sensitive s-expressions with glue, no vocabulary.
sexlex = { path = "sexlex" }
# The symbol vocabulary, the type lattice over it, and the bump tier both rest on.
lattice = { path = "lattice" }
# The one self-referential value: `CellSubstrate` owns program storage beside the graph that
# borrows it. `self_cell` carries the `unsafe` that needs; koan writes none.
self_cell = "1.3"
# Inline-capacity vectors for the parser's short shapes, so a small form stays on the stack.
# `union`: stores the inline slots in a union rather than an enum, matching cellgraph's own use —
# one version in the graph.
smallvec = { version = "1.15", features = ["union"] }
dhat = { version = "0.3.3", optional = true }

[dev-dependencies]
proptest = "1"
