[workspace]
members = ["workgraph", "cellgraph", "sexlex"]
default-members = [".", "workgraph", "cellgraph", "sexlex"]
resolver = "2"

[package]
name = "koan"
version = "0.1.0"
edition = "2024"

[lib]
name = "koan"
path = "src/lib.rs"

[[bin]]
name = "koan"
path = "src/main.rs"
# The interpreter binary drives the pending-rewrite runtime, so it builds only with that feature.
required-features = ["pending_rewrite"]

[features]
# The pre-rewrite runtime: `machine`, `builtins`, the interpreter binary, the integration tests
# and every test that reaches a value or a scope. Off by default so the default build, test and
# lint slate covers only the modules the rewrite keeps — `memory`, `parse`, `source`,
# `type_lattice` and the embedded crates. `cargo test --features pending_rewrite` runs the whole
# old suite. Every other feature below is a knob on the old runtime, so each turns this one on.
pending_rewrite = []

# Escape-seam verification builds — mutually exclusive (a `compile_error!` guards the pair).
# Force every record escape seam to a single verb so the output-asserting suite becomes an
# equivalence battery: identical hardcoded expectations under each prove the policy is
# semantically invisible.
seam-force-copy = ["pending_rewrite"]   # escape seam always copies records
seam-force-pin  = ["pending_rewrite"]   # escape seam always pins records

# Reach-tightness auditing: the over-pinning report at the fold chokepoint
# (`machine::core::reach_audit`). Off by default and absent from a release build; `cargo run
# --features region-audit -- <program>` turns it on for a debug interpreter run.
region-audit = ["pending_rewrite"]

# Whole-program instrument counts: wraps the binary's allocator in the delegating counter
# at `audit/counting_alloc.rs` and arms the symbol-mint tally in `machine::model::labels`,
# reporting the run's `allocations:` and `symbols_minted:` totals on stderr.
# `cargo run --features alloc-count -- audit/shapes/wide_n100.koan` reads one shape;
# `tools/alloc_audit.py` reads them all. Off by default, so a normal build keeps `mimalloc`
# unwrapped — and because the counter wraps rather than replaces, the counted build and
# the shipped build allocate through the same allocator.
alloc-count = ["pending_rewrite"]
dhat = ["pending_rewrite", "dep:dhat"]

[dependencies]
indexmap = "2"
mimalloc = { version = "0.1", default-features = false }
stable_deref_trait = "1.2.1"
# The cell tier's substrate: cells, their regions, the carrier states and the liveness matrix.
cellgraph = { path = "cellgraph" }
# The layout half of the parser: whitespace-sensitive s-expressions with glue, no vocabulary.
sexlex = { path = "sexlex" }
blake3 = "1.8.5"
# The bump tier's arena: storage outside the graph for the AST and the type lattice's registry and
# scratch. `allocator-api2` turns on `impl Allocator for &Bump`, the seam the tier's growable
# vector and hash table are built over. Same version cellgraph pins.
bumpalo = { version = "3.20.3", features = ["allocator-api2"] }
# The bump tier's hash table — the type lattice's registry node table rides it.
hashbrown = "0.17"
# The `Allocator` trait `&Bump` implements, and the growable `Vec` the bump tier builds over it —
# `std::vec::Vec` has no stable custom-allocator seam.
allocator-api2 = "0.2.21"
# Inline-capacity vectors for the parser's short shapes, so a small form stays on the stack.
# `union`: stores the inline slots in a union rather than an enum, matching cellgraph's own use —
# one version in the graph.
smallvec = { version = "1.15", features = ["union"] }
# Persistent HAMT for the type registry's node table. No features: the optional `triomphe`
# feature swaps the default shared pointer to an atomic one, and the registry is single-threaded
# per run frame, so it instantiates the map over `archery::RcK` instead.
imbl = "7"
dhat = { version = "0.3.3", optional = true }

[dev-dependencies]
trybuild = "1.0"
proptest = "1"
