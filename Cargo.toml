[workspace]
members = ["cellgraph", "sexlex"]
default-members = [".", "cellgraph", "sexlex"]
resolver = "2"

[package]
name = "koan"
version = "0.1.0"
edition = "2024"
default-run = "koan"

[lib]
name = "koan"
path = "src/lib.rs"

[[bin]]
name = "koan"
path = "src/main.rs"

[features]
# The dhat attribution profiler: owns the binary's global allocator and writes `dhat-heap.json`
# (`tools/dhat_diff.py`).
dhat = ["dep:dhat"]

[dependencies]
indexmap = "2"
mimalloc = { version = "0.1", default-features = false }
stable_deref_trait = "1.2.1"
# The cell tier's substrate: cells, their regions, the carrier states and the liveness matrix.
cellgraph = { path = "cellgraph" }
# The layout half of the parser: whitespace-sensitive s-expressions with glue, no vocabulary.
sexlex = { path = "sexlex" }
blake3 = "1.8.5"
# The bump tier's arena: storage outside the graph for the AST and the type lattice's registry and
# scratch. `allocator-api2` turns on `impl Allocator for &Bump`, the seam the tier's growable
# vector and hash table are built over. Same version cellgraph pins.
bumpalo = { version = "3.20.3", features = ["allocator-api2"] }
# The bump tier's hash table — the type lattice's registry node table rides it.
hashbrown = "0.17"
# The `Allocator` trait `&Bump` implements, and the growable `Vec` the bump tier builds over it —
# `std::vec::Vec` has no stable custom-allocator seam.
allocator-api2 = "0.2.21"
# The one self-referential value: `CellSubstrate` owns program storage beside the graph that
# borrows it. `self_cell` carries the `unsafe` that needs; koan writes none.
self_cell = "1.3"
# Inline-capacity vectors for the parser's short shapes, so a small form stays on the stack.
# `union`: stores the inline slots in a union rather than an enum, matching cellgraph's own use —
# one version in the graph.
smallvec = { version = "1.15", features = ["union"] }
# Persistent HAMT for the type registry's node table. No features: the optional `triomphe`
# feature swaps the default shared pointer to an atomic one, and the registry is single-threaded
# per run frame, so it instantiates the map over `archery::RcK` instead.
imbl = "7"
dhat = { version = "0.3.3", optional = true }

[dev-dependencies]
proptest = "1"
