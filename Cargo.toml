[workspace]
members = ["workgraph"]
default-members = [".", "workgraph"]
resolver = "2"

[package]
name = "koan"
version = "0.1.0"
edition = "2024"

[lib]
name = "koan"
path = "src/lib.rs"

[[bin]]
name = "koan"
path = "src/main.rs"

[features]
# Escape-seam verification builds — mutually exclusive (a `compile_error!` guards the pair).
# Force every record escape seam to a single verb so the output-asserting suite becomes an
# equivalence battery: identical hardcoded expectations under each prove the policy is
# semantically invisible.
seam-force-copy = []   # escape seam always copies records
seam-force-pin  = []   # escape seam always pins records

# Reach-tightness auditing: the over-pinning report at the fold chokepoint
# (`machine::core::reach_audit`). Off by default and absent from a release build; `cargo run
# --features region-audit -- <program>` turns it on for a debug interpreter run. Pulls
# workgraph's white-box reach readers in, which is what a tightness comparison reads.
region-audit = ["workgraph/test-hooks"]

# Whole-program instrument counts: wraps the binary's allocator in the delegating counter
# at `audit/counting_alloc.rs` and arms the symbol-mint tally in `machine::model::labels`,
# reporting the run's `allocations:` and `symbols_minted:` totals on stderr.
# `cargo run --features alloc-count -- audit/shapes/wide_n100.koan` reads one shape;
# `tools/alloc_audit.py` reads them all. Off by default, so a normal build keeps `mimalloc`
# unwrapped — and because the counter wraps rather than replaces, the counted build and
# the shipped build allocate through the same allocator.
alloc-count = []
dhat = ["dep:dhat"]

[dependencies]
indexmap = "2"
mimalloc = { version = "0.1", default-features = false }
stable_deref_trait = "1.2.1"
workgraph = { path = "workgraph" }
blake3 = "1.8.5"
# Hash table for the per-scope binding tables, built over workgraph's `BumpAllocator` so a scope's
# buckets live in its region's bump. Same major as workgraph's, so `DefaultHashBuilder` and the
# `Equivalent` probes are one trait across the two crates.
hashbrown = "0.17"
# The `Allocator` trait `BumpAllocator` implements, and the growable `Vec` a dispatch bucket takes
# over it — `std::vec::Vec` has no stable custom-allocator seam.
allocator-api2 = "0.2.21"
# Inline-capacity vectors for the aggregate relocation's staging buffers, so a small literal
# stages its cells on the stack. `union`: stores the inline slots in a union rather than an enum,
# matching workgraph's own use — one version in the graph.
smallvec = { version = "1.15", features = ["union"] }
# Persistent HAMT for the type registry's node table. No features: the optional `triomphe`
# feature swaps the default shared pointer to an atomic one, and the registry is single-threaded
# per run frame, so it instantiates the map over `archery::RcK` instead.
imbl = "7"
dhat = { version = "0.3.3", optional = true }

[dev-dependencies]
workgraph = { path = "workgraph", features = ["test-hooks"] }
trybuild = "1.0"
