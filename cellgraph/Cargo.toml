[package]
name = "cellgraph"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# The measurement harness: `cargo run -p cellgraph --features perf --bin perf`. Off by default so
# the library build, its tests, and the Miri slate never compile it.
perf = []

[[bin]]
name = "perf"
path = "perf/main.rs"
required-features = ["perf"]

[dependencies]
# The per-cell region's storage. A `Bump` allocates in pointer-stable chunks and never runs a
# destructor, which is exactly the region contract: every family a region hosts is `DropFree`, and
# death is chunk deallocation. Moving a `Bump` moves no chunk byte, which is what lets a sealed
# region's storage detach from its slot unmoved.
# `allocator-api2` is the scratch region's half: it turns on `impl Allocator for &Bump`, which is
# the seam a verb's growable worklist is built over, so the worklist costs no allocation on a table
# whose chunk already fits it.
bumpalo = { version = "3.20.3", features = ["allocator-api2"] }
# The `Allocator` trait bumpalo's impl above satisfies, and the `Vec` that is generic over it —
# std's is not, on stable. Same crate and same version workgraph's `BumpVec` names; the two aliases
# collapse into one when cellgraph is adopted there.
allocator-api2 = "0.2.21"
# The sparse half of an id set: the ids inline up to two and spill to the heap past that, so a
# reach naming at most two sealed regions is built, copied and rewritten without the allocator.
# Same crate and same version koan and workgraph name; `const_new` is what keeps an empty set a
# `const fn`, which the mask constants are built out of.
smallvec = { version = "1.15", features = ["union", "const_new"] }

[dev-dependencies]
# Random create / place / hold / release interleavings for the liveness-matrix invariants; the
# hand-written tests pin shapes, the property test pins the invariants across orders.
proptest = "1"
