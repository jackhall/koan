[package]
name = "workgraph"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Widens the white-box test surface (scheduler slot/edge pokes) for the
# embedder's own tests. Off in production builds.
test-hooks = []

[dependencies]
stable_deref_trait = "1.2.1"
elsa = "1"
# `allocator-api2`: turns on `impl Allocator for &Bump`, the impl `BumpAllocator` forwards to, and
# with it the seam a `hashbrown` table is built over so its buckets land in the region's own bump
# rather than the global heap. See `BumpAllocator` / `BumpMap` in src/witnessed/bump.rs.
bumpalo = { version = "3.20.3", features = ["allocator-api2"] }
# The `Allocator` trait `BumpAllocator` implements, named directly because the handle is a newtype
# over `&Bump` rather than the bare reference bumpalo's own impl covers. One version in the graph —
# bumpalo's feature and hashbrown's default both resolve to it.
allocator-api2 = "0.2.21"
# Hash table for the `BumpMap` index door. Chosen over `std` for that same stable custom-allocator
# seam (`allocator-api2`, on by default), which `std::collections::HashMap` has no stable equivalent
# of. Default features also supply the `DefaultHashBuilder` the door names.
hashbrown = "0.17"
# `union`: stores the inline slots in a union rather than an enum, so a two-slot reach set
# measures exactly what the `Vec` it replaced did (24 bytes for a pointer-sized member) instead of
# carrying a discriminant word. See `ReachSet` in src/witnessed/reach.rs.
smallvec = { version = "1.15", features = ["union"] }
